name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A new push to the same branch supersedes any run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  latency:
    name: Latency fence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Asserts the shape rather than a wall-clock figure, so it means the same thing on
      # any runner: the scan must stay roughly linear in the size of the library, and
      # must not issue more store calls per note than it does today. The quadratic parser
      # this now catches was invisible to every other job.
      - run: npm run latency

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Advisory. This is a local, offline notes app, so a build-time advisory is not an
      # exposure — but nothing was watching the count, so it could only grow.
      - run: npm audit --audit-level=high
        continue-on-error: true

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Unit tests cannot see integration: every bug this suite has found so far — a
      # screen rendering the version of a note from before the edit, an editor writing a
      # stale buffer over a tab — passed 300 unit tests first. It runs against the web
      # export, whose file store is in memory and seeded, so each test starts identical.
      - name: Install chromium
        run: npx playwright install --with-deps chromium

      - run: npm run e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  build:
    name: Build iOS bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Bundles the app through Metro exactly as a release build does. This catches
      # broken imports, bad module resolution across the monorepo, and anything the
      # type checker cannot see. It does not produce an .ipa — that needs a macOS
      # runner and Apple credentials, neither of which this project has.
      - run: npm run build:ios

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: ios-bundle
          path: apps/mobile/dist/
          retention-days: 7
