name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A new push to the same branch supersedes any run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build iOS bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Bundles the app through Metro exactly as a release build does. This catches
      # broken imports, bad module resolution across the monorepo, and anything the
      # type checker cannot see. It does not produce an .ipa — that needs a macOS
      # runner and Apple credentials, and belongs with EAS once we ship to TestFlight.
      - run: npm run build:ios

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: ios-bundle
          path: apps/mobile/dist/
          retention-days: 7
