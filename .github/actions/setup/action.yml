name: Setup
description: Checkout-adjacent Node and dependency setup shared by every CI job.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      shell: bash
      # Only the end-to-end job needs a browser, and it fetches one itself. Every other
      # job would be downloading 150MB to run nothing.
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      run: npm ci
