name: Setup
description: Checkout-adjacent Node and dependency setup shared by every CI job.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      shell: bash
      # The end-to-end flows are not part of CI, so skip fetching a browser no job uses.
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      run: npm ci
